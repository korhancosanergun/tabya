[workspace]
resolver = "2"
members = ["crates/tabya-core", "crates/tabya-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
repository = "https://github.com/korhancosanergun/tabya"
authors = ["Korhan Coşan Ergün"]
keywords = ["security", "hardening", "audit", "blue-team", "compliance"]
categories = ["command-line-utilities"]

[workspace.dependencies]
tabya-core = { path = "crates/tabya-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
regex = "1"
glob = "0.3"
clap = { version = "4", features = ["derive"] }
anstream = "1"
anstyle = "1"
winreg = "0.56"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1
strip = true
